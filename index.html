<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <!--
      アセットを相対パスで読むので、その基準をここで決める。
      サイトの置き場所はサーバによって違う(XREAの共有SSLなら /eteoil.s325.xrea.com/、
      IPFSなら /ipfs/<CID>/ の下)ので、開いているURLから逆算する。
      ページのパスを取り除いた残りが置き場所。末尾のスラッシュの有無も吸収できる。
      アセットを読み込むタグより先に置くこと
    -->
    <script>
      (function () {
        var routes = ['/shvlang']; // src/router と合わせること
        var path = window.location.pathname;
        var dir = path.replace(/[^/]*$/, '');
        for (var i = 0; i < routes.length; i += 1) {
          var at = path.indexOf(routes[i] + '/');
          if (at < 0 && path.slice(-routes[i].length) === routes[i]) at = path.length - routes[i].length;
          if (at >= 0) { dir = path.slice(0, at + 1); break; }
        }
        var tag = document.createElement('base');
        tag.setAttribute('href', dir);
        document.head.appendChild(tag);
      }());
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
